name: Release

# Merging `next` into `main` is the release: every push to main publishes
# the version in package.json as GitHub Release v<version>, tag included,
# with no manual step. It runs the same checks as CI, packages the zip and
# publishes it as the release that Decky's "install from URL", Direct
# Updater and the README link all resolve against
# (releases/latest/download/<asset>).
#
# A push whose version is already released (a rerun, or main moving without
# a bump) publishes nothing; ci.yml's "Release gate" stops the second case
# at the PR. Beta tags (v*-beta.*) belong to beta.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Release plan
    # A manual run from another branch must never publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history so every release tag is present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: plan
        run: |
          set -euo pipefail
          python3 tools/version.py check
          version="$(python3 tools/version.py show)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "::notice::v${version} is already released; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same gate as the PR into main (tools/release-check.ts).
          git tag -l 'v*' | bun tools/release-check.ts "$version"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend engine
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the WowUp reference checkout
        run: make wowup
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the nix-locked bun (flake.lock); see ci.yml.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run typecheck
        working-directory: backend
      # The integration tests spawn backend/out/wowdeck.
      - run: bun run build
        working-directory: backend
      - run: bun test
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          path: backend/out/wowdeck
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [plan, frontend, backend]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The version's CHANGELOG.md section, written for players
      # (tools/release-notes.ts); a missing section fails the release here.
      - name: Release notes
        run: bun tools/release-notes.ts "$VERSION" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/out/

      # The three versioned files and the zip inside the release must all say
      # the planned number; nothing downstream can notice a mismatch.
      - name: Check the tree's version
        run: |
          set -euo pipefail
          python3 tools/version.py check
          if [ "$(python3 tools/version.py show)" != "$VERSION" ]; then
            echo "tree version differs from the planned ${VERSION}" >&2
            exit 1
          fi

      - run: python3 tools/test_package.py -v
      # Same bundled-key handling as ci.yml: the secret is optional and the
      # plugin's user-key fallback covers builds without it. See
      # docs/curseforge-api-key.md.
      - run: chmod +x backend/out/wowdeck && python3 tools/package.py
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Checksum the asset
        run: sha256sum build/*.zip

      # The asset keeps the zip's own name, which is the plugin's display
      # name by design: Decky's install-from-URL takes the plugin name from
      # the last URL segment and compares it with the installed plugin, so
      # any other asset name breaks updating from a URL (see
      # tools/package.py's zip_path()). Do not add a version-named copy.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" build/*.zip \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
