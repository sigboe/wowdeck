name: CI

# Pushes to `next` run these jobs through beta.yml, which calls this
# workflow with the beta version to stamp and publishes only if every job
# passes; listing `next` here as well would run each gate twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: A beta version (X.Y.Z-beta.N) to stamp into the build; never committed.
        type: string
        required: false
        default: ""

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A beta build carries its own version: the engine bundles
      # backend/package.json's at build time and the zip ships package.json
      # and plugin.json, so every job stamps before it builds.
      - if: inputs.version != ''
        run: python3 tools/version.py stamp "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # The frontend suite runs on bun (package.json "test"); keep the
      # version in step with the backend job's nix-locked bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # tests/wowup-import-compat.test.ts runs upstream's import code; the
      # reference checkout is untracked, so fetch the pinned commit here.
      - name: Fetch the WowUp reference checkout
        run: make wowup
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the nix-locked bun (flake.lock): bun's
          # --compile output varies a lot between versions (1.4.2 is
          # ~82 MB; current "latest" is ~109 MB), and release binaries
          # must match what local builds produce.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun run typecheck
        working-directory: backend
      # The integration tests spawn backend/out/wowdeck-x86_64, so the engine must
      # exist before the suite runs on a fresh checkout.
      - run: bun run build
        working-directory: backend
      - run: bun test
        working-directory: backend
      # The beta workflow's version and prune decisions (tools/beta-release.ts)
      # and the release gate (tools/release-check.ts).
      - run: bun test ./tools
      # The tests run the engine at its committed version: they mock that
      # version as the latest stable release, which a beta version can never
      # be. A beta build then stamps its version and rebuilds the engine
      # it ships, which differs from the tested one only in that string.
      - if: inputs.version != ''
        run: python3 tools/version.py stamp "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - if: inputs.version != ''
        run: bun run build
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-binary
          # One engine per architecture (tools/package.py ENGINES).
          path: backend/out/wowdeck-*
          retention-days: 7

  package:
    name: Package plugin zip
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: inputs.version != ''
        run: python3 tools/version.py stamp "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: backend-binary
          path: backend/out/
      - run: python3 tools/test_package.py -v
      # package.json, plugin.json and backend/package.json must agree; the
      # release workflow refuses to publish otherwise.
      - run: python3 tools/test_version.py -v
      # main.py must forward every contract method unchanged (AGENTS.md
      # "Contracts first").
      - run: python3 tools/test_main_bridge.py
      # tools/package.py reads CURSEFORGE_API_KEY and bundles it into the
      # generated bin/bundled-curseforge-key resource — a repository
      # secret, never checked into source. GitHub Actions itself withholds
      # secrets from a pull_request run triggered by a fork, so those runs
      # — and any run in a repo where the secret was never configured at
      # all — correctly produce a no-bundled-key package; the plugin's own
      # user-key fallback (Options) covers that case. See
      # docs/curseforge-api-key.md for how to configure the secret.
      # Artifacts lose the executable bit; the packager sets it on bin/.
      - run: python3 tools/package.py
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: build/*.zip

  # Merging into main publishes a release (release.yml), so a PR into main
  # must already be releasable: a new X.Y.Z, its CHANGELOG.md section
  # written and nothing left under [Unreleased] (tools/release-check.ts).
  release-gate:
    name: Release gate
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Full history so every release tag is present.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: |
          set -euo pipefail
          python3 tools/version.py check
          git tag -l 'v*' | bun tools/release-check.ts "$(python3 tools/version.py show)"
